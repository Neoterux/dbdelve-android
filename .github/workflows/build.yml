name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Run by hand from the Actions tab: with a version, it also publishes that
  # release, creating its tag on the commit built.
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release of this version, e.g. 0.1.0 (leave empty to only build)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust core on its own: format, lint, unit tests, and the live tests
  # against the three servers the app speaks, MySQL at 5.6.
  core:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.6
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: dev
        ports: ["53356:3306"]
        options: >-
          --health-cmd "mysqladmin ping -ppw"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: dev
        ports: ["55416:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:7
        ports: ["57007:27017"]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Known vulnerabilities in the dependency tree fail the build;
      # unmaintained or unsound crates are reported without failing it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      # Servers with a private CA, a self-signed certificate and client
      # certificates, for the TLS tests.
      - name: TLS servers
        run: |
          mkdir -p "$RUNNER_TEMP/tls"
          ../.github/tls.sh "$RUNNER_TEMP/tls" >> "$GITHUB_ENV"
      - name: Tests, live ones included
        env:
          DBDELVE_ANDROID_MYSQL: 127.0.0.1:53356:root:pw:dev
          DBDELVE_ANDROID_POSTGRES: 127.0.0.1:55416:postgres:pw:dev
          DBDELVE_ANDROID_MONGO: "127.0.0.1:57007:::dev"
        run: cargo test --locked -- --include-ignored

  # The APK: the core cross-compiled for arm64 by cargo-ndk, the Kotlin
  # bindings generated from it, and the Compose app around them.
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      # The release key. A pull request may build with this runner's throwaway
      # debug key (a fork's pull request gets no secrets); anything else, a
      # push to main, a tag or a published release, stops here without it:
      # 0.1.0 went out debug-signed when this was only a warning, and an APK
      # signed with another key cannot update the installed app.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.DBDELVE_SIGNING_KEYSTORE_BASE64 }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "DBDELVE_REQUIRE_SIGNING=true" >> "$GITHUB_ENV"
          fi
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DBDELVE_SIGNING_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          elif [ "$EVENT" = "pull_request" ]; then
            echo "::warning::No DBDELVE_SIGNING_KEYSTORE_BASE64 secret: this pull request's APK is signed with a throwaway debug key and cannot update an installed one."
          else
            echo "::error::No DBDELVE_SIGNING_KEYSTORE_BASE64 secret. A $EVENT build is a release build and must be signed with the release key; see the README's Release builds."
            exit 1
          fi
      - name: Build
        env:
          DBDELVE_SIGNING_STORE_PASSWORD: ${{ secrets.DBDELVE_SIGNING_STORE_PASSWORD }}
          DBDELVE_SIGNING_KEY_ALIAS: ${{ secrets.DBDELVE_SIGNING_KEY_ALIAS }}
          DBDELVE_SIGNING_KEY_PASSWORD: ${{ secrets.DBDELVE_SIGNING_KEY_PASSWORD }}
        # The runner image ships the Android SDK and NDKs; point cargo-ndk at
        # the newest.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew --no-daemon :app:assembleRelease
      # The key the APK was really signed with: never the debug key outside a
      # pull request, whatever Gradle was told.
      - name: Check the signature
        if: github.event_name != 'pull_request'
        run: |
          set -x
          # The build tools of compileSdk 35 when installed, else the newest.
          tools="$ANDROID_HOME/build-tools/35.0.0"
          [ -x "$tools/apksigner" ] || tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          certs="$("$tools/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk 2>&1)"
          echo "$certs"
          # Each signer's line reads "Signer #1 certificate DN:" or, where the
          # key was rotated, "Signer (minSdkVersion=…) certificate DN:".
          if ! echo "$certs" | grep -q 'certificate DN:'; then
            echo "::error::apksigner names no signer for the release APK."
            exit 1
          fi
          if echo "$certs" | grep 'certificate DN:' | grep -q 'CN=Android Debug'; then
            echo "::error::The release APK is signed with a debug key."
            exit 1
          fi
      # Android Lint: the SDK's own static analysis, including Compose's
      # checks. Errors fail the build; the full report is kept either way.
      - name: Android Lint
        run: ./gradlew --no-daemon :app:lintRelease
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dbdelve-android-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      # A tag publishes the APK on the repository's Releases page, named for
      # its version, with that version's changelog section as the notes.
      - name: Release notes and APK name
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED:-${GITHUB_REF_NAME#v}}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="$version" '$0 ~ "^## " v " " {f=1; next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk "dbdelve-android-$version.apk"
      - if: steps.release.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DBDelve Android v${{ steps.release.outputs.version }}
          body_path: release-notes.md
          files: dbdelve-android-*.apk
    permissions:
      contents: write
